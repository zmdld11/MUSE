# VER-SEP 1.0：becruily mel-band-roformer-guitar 的 MoisesDB 吉他域微调（服务器正式版）
# 音频/模型段与官方 config_guitar_becruily.yaml 完全一致（不改动结构参数）；
# 只改 training 段为微调规模，并新增轻量数据增强。
# 数据：D:/program_project/MUSE/data/moisesdb_guitar_pilot_v1（本地生成后上传 train/ 与 valid/）
# 启动：见 score_extraction/separation/README_finetune.md

audio:
  chunk_size: 485100
  dim_f: 1024
  dim_t: 256
  hop_length: 441
  n_fft: 2048
  num_channels: 2
  sample_rate: 44100
  min_mean_abs: 0.000

model:
  dim: 256
  depth: 4
  stereo: true
  num_stems: 1
  time_transformer_depth: 1
  freq_transformer_depth: 1
  num_bands: 60
  dim_head: 64
  heads: 8
  attn_dropout: 0
  ff_dropout: 0
  flash_attn: true
  dim_freqs_in: 1025
  sample_rate: 44100
  stft_n_fft: 2048
  stft_hop_length: 441
  stft_win_length: 2048
  stft_normalized: false
  mask_estimator_depth: 2
  multi_stft_resolution_loss_weight: 1.0
  multi_stft_resolutions_window_sizes: !!python/tuple
  - 4096
  - 2048
  - 1024
  - 512
  - 256
  multi_stft_hop_size: 147
  multi_stft_normalized: false
  mlp_expansion_factor: 1

training:
  batch_size: 2              # batch4 在 A5000 22GB OOM（内部 multi-STFT loss 开销大）；用累积保持有效 batch
  gradient_accumulation_steps: 2
  grad_clip: 1.0
  instruments:
  - Guitar
  - Other
  lr: 0.00002               # prodigy lr1.0 是从零训练配方，微调时1个epoch内毁掉预训练权重（val SDR 5.74→0.001）；
                            # 改 adamw 2e-5 保守微调，训练前用 --pre_valid 打基线
  patience: 3                # 验证 loss 连续 3 epoch 不降则早停
  reduce_factor: 0.95
  target_instrument: Guitar
  num_epochs: 12             # 每个 epoch = num_steps 个 batch
  num_steps: 500
  q: 0.95
  coarse_loss_clip: false
  ema_momentum: 0.999
  optimizer: adamw
  other_fix: false
  use_amp: true

# 增强必须关闭：MSST 此 fork 的 load_aligned_data（dataset_type 6）先 sum 出 mix、
# 再对每个 stem 独立做随机极性/响度/声道交换，返回的 (mix, target) 不自洽，
# 会把监督信号破坏掉（实测 500 步内 val SDR 4.85→0.04，lr 无关）。
# v2 若要增强：先改 dataset.py 让增强后重算 mix，或换 dataset_type 1-3。
augmentations:
  enable: false

inference:
  batch_size: 1
  dim_t: 1101
  num_overlap: 2
