audio:
  chunk_size: 352800
  dim_f: 1024
  dim_t: 256
  hop_length: 441
  n_fft: 2048
  num_channels: 2
  sample_rate: 44100
  min_mean_abs: 0.000

model:
  dim: 384
  depth: 6
  stereo: true
  num_stems: 1
  time_transformer_depth: 1
  freq_transformer_depth: 1
  num_bands: 60
  dim_head: 64
  heads: 8
  attn_dropout: 0
  ff_dropout: 0
  flash_attn: True
  dim_freqs_in: 1025
  sample_rate: 44100  # needed for mel filter bank from librosa
  stft_n_fft: 2048
  stft_hop_length: 441
  stft_win_length: 2048
  stft_normalized: False
  mask_estimator_depth: 2
  multi_stft_resolution_loss_weight: 1.0
  multi_stft_resolutions_window_sizes: !!python/tuple
  - 4096
  - 2048
  - 1024
  - 512
  - 256
  multi_stft_hop_size: 147
  multi_stft_normalized: False

# ---- S1v2-1 TA-Sep 人声侧微调（2026-09-02，training 段覆盖 KJ 原版）----
training:
  batch_size: 2
  gradient_accumulation_steps: 2
  grad_clip: 1.0
  instruments:
  - Vocals
  - Other
  lr: 0.00002
  patience: 3
  reduce_factor: 0.95
  target_instrument: Vocals
  num_epochs: 12
  num_steps: 500
  q: 0.95
  coarse_loss_clip: false
  ema_momentum: 0.999
  optimizer: adamw
  other_fix: false
  use_amp: true

# 增强必须关闭（dataset_type 6 的 stem 独立增强破坏监督自洽，吉他版实测）
augmentations:
  enable: false

inference:
  batch_size: 2
  dim_t: 801
  num_overlap: 2
